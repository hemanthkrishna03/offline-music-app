<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Offline Music App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <meta name="theme-color" content="#111827">
</head>

<body>

  <body>

  <h2>🎧 Offline Music App</h2>

  <!-- 🎧 Player Card -->
  <audio id="audio"></audio>

  <div class="player">
    <div id="songTitle">🎵 No song selected</div>
  
    <input type="range" id="progress" value="0" min="0" max="100">
  
    <div class="controls">
      <button onclick="playPrevious()">
        <i class="bi bi-skip-backward-fill"></i>
      </button>

      <button type="button" id="playPauseBtn" onclick="togglePlayPause()">
        <i class="bi bi-play-fill"></i>
      </button>

      <button onclick="playNext()">
        <i class="bi bi-skip-forward-fill"></i>
      </button>

      <button onclick="toggleShuffle()">🔀</button>

      <button onclick="toggleRepeat()">🔁</button>
    </div> 
  </div>

  <!-- 🔍 Search -->
  <input 
    type="text" 
    id="search" 
    placeholder="🔍 Search songs..." 
    oninput="searchSongs()" 
  />

  <!-- 📁 Folders -->
  <h3>📁 Folders</h3>
  <button onclick="createFolder()">➕ Create Folder</button>
  <ul id="folders"></ul>

  <!-- 🎵 Songs -->
  <h3>🎵 Songs</h3>
  <ul id="playlist"></ul>

  <script src="app.js"></script>
  <script src="app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>

</body>

</body>
</html>
