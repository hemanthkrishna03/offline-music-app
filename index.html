<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0d">
  <title>My Music</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<main id="app">

  <!-- HOME -->
  <section id="homeScreen" class="screen home-screen">

    <header class="home-header">
      <h1>Start with your <span>Vibe</span></h1>
    </header>

    <div class="category-grid">

      <button class="category-card" data-category="allSongs">
        <div class="category-image">
          <img src="coverss/All songs.png" alt="All Songs">
        </div>
        <div class="category-title">All Songs</div>
      </button>

      <button class="category-card" data-category="recentlyPlayed">
        <div class="category-image">
          <img src="coverss/recently played.png" alt="Recently Played">
        </div>
        <div class="category-title">Recently Played</div>
      </button>

      <button class="category-card" data-category="favouriteHero">
        <div class="category-image">
          <img src="coverss/Favourite Hero.png" alt="Favourite Hero">
        </div>
        <div class="category-title">Favourite Hero</div>
      </button>

      <button class="category-card" data-category="playlists">
        <div class="category-image">
          <img src="coverss/Playlists.png" alt="Playlists">
        </div>
        <div class="category-title">Playlists</div>
      </button>

    </div>
  </section>


  <!-- ALL SONGS / LIST PAGE -->
  <section id="songListScreen" class="screen list-screen hidden">

    <header class="list-header">

      <button id="backButton"
              class="icon-button"
              aria-label="Back">
        ←
      </button>

      <h2 id="categoryTitle">All Songs</h2>

      <button id="headerMenuButton"
              class="icon-button"
              aria-label="Queue">
        ☷
      </button>

    </header>


    <!-- SEARCH -->
    <div id="searchWrap" class="search-wrap">

      <span class="search-icon">⌕</span>

      <input
        id="search"
        type="search"
        placeholder="Search songs..."
        autocomplete="off"
      >

    </div>


    <!-- SONG LIST -->
    <div id="songList" class="song-list"></div>

  </section>

</main>


<!-- =========================
     MINI PLAYER
     ========================= -->

<aside id="miniPlayer"
       class="mini-player hidden"
       aria-label="Currently playing">

  <button id="miniSongButton"
          class="mini-song">

    <img id="miniCover" src="" alt="">

    <span class="mini-text">
      <strong id="miniTitle">—</strong>
      <small id="miniArtist">—</small>
    </span>

  </button>


  <button id="miniQueueButton"
          class="mini-action"
          aria-label="Queue">
    ☷
  </button>


  <button id="miniLoopButton"
          class="mini-action"
          aria-label="Loop">
    ↻
  </button>


  <button id="miniPlayButton"
          class="mini-play"
          aria-label="Play">
    ▶
  </button>

</aside>


<!-- =========================
     FULL PLAYER
     ========================= -->

<section id="playerScreen"
         class="player-screen hidden">

  <header class="player-header">

    <button id="playerBackButton"
            class="icon-button">
      ←
    </button>

    <button id="playerQueueButton"
            class="icon-button">
      ☷
    </button>

  </header>


  <div class="player-card">

    <img id="albumCover"
         class="player-cover"
         src=""
         alt="Album cover">


    <h1 id="songTitle">—</h1>

    <p id="songArtist">—</p>

    <p id="songYear">—</p>


    <div class="progress-area">

      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
      >

      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>

    </div>


    <div class="player-controls">

      <button id="previousButton"
              class="round-control">
        ⏮
      </button>

      <button id="playButton"
              class="round-control main-play">
        ▶
      </button>

      <button id="nextButton"
              class="round-control">
        ⏭
      </button>

    </div>


    <div class="player-secondary">

      <button id="loopButton">
        ↻
      </button>

      <button id="playNextToggleButton">
        ⏭
      </button>

    </div>

  </div>

</section>


<!-- =========================
     QUEUE
     ========================= -->

<section id="queuePanel"
         class="drawer hidden">

  <div class="drawer-card">

    <div class="drawer-header">

      <h3>Queue</h3>

      <button id="closeQueueButton"
              class="icon-button">
        ×
      </button>

    </div>

    <div id="queueList"
         class="queue-list">
    </div>

  </div>

</section>


<!-- =========================
     PLAYLIST PICKER
     ========================= -->

<section id="playlistPanel"
         class="drawer hidden">

  <div class="drawer-card">

    <div class="drawer-header">

      <h3>Choose Playlist</h3>

      <button id="closePlaylistButton"
              class="icon-button">
        ×
      </button>

    </div>

    <div id="playlistList"
         class="playlist-list">
    </div>

  </div>

</section>


<!-- =========================
     MORE OPTIONS MENU
     ========================= -->

<div id="contextMenu"
     class="context-menu hidden">
</div>


<audio id="audio"
       preload="metadata">
</audio>


<script src="app.js"></script>

</body>
</html>
