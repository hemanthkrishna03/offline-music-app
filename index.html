<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Music</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- =========================
         HOME SCREEN
    ========================= -->

    <section id="homeScreen" class="home-screen">

        <header class="home-header">
            <h1>Start with your <span>Vibe</span></h1>
            <div class="header-line"></div>
        </header>

        <div class="category-grid">

            <!-- All Songs -->
            <button class="category-card all-songs"
                    onclick="openCategory('allSongs')">

                <div class="category-image">
                    <img src="covers/All songs.png" alt="All Songs">
                </div>

                <div class="category-title">
                    All Songs
                </div>

            </button>


            <!-- Recently Played -->
            <button class="category-card recently-played"
                    onclick="openCategory('recentlyPlayed')">

                <div class="category-image">
                    <img src="covers/recently played.png"
                         alt="Recently Played">
                </div>

                <div class="category-title">
                    Recently Played
                </div>

            </button>


            <!-- Favourite Hero -->
            <button class="category-card favourite-hero"
                    onclick="openCategory('favouriteHero')">

                <div class="category-image">
                    <img src="covers/Favourite Hero.png"
                         alt="Favourite Hero">
                </div>

                <div class="category-title">
                    Favourite Hero
                </div>

            </button>


            <!-- Playlists -->
            <button class="category-card playlists"
                    onclick="openCategory('playlists')">

                <div class="category-image">
                    <img src="covers/Playlists.png"
                         alt="Playlists">
                </div>

                <div class="category-title">
                    Playlists
                </div>

            </button>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>
</html>
